baseURL = 'https://example.org/'
languageCode = 'en-us'
title = 'Notefy Notes Site'
theme = 'ananke'
SectionPageMenu = "main"

# Goldmark configuration for math support
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]

# Site parameters
[params]
  math = true
  mainSections = ["Chemistry", "Math", "Editorial"]
